name: CI

on:
  push:
    branches: [ master, "**" ]
    tags:
      - "python/v*.*.*"
      - "r/v*.*.*"
  pull_request:
  workflow_dispatch: {}

# Required for PyPI/TestPyPI Trusted Publishing (OIDC)
permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            plat: manylinux2014_x86_64
          - os: windows-latest
            rid: win-x64
            plat: win_amd64
          - os: macos-14
            rid: osx-arm64
            plat: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip' # caching pip dependencies

      - name: Install Python build tooling
        run: python -m pip install -U wheel build

      - name: Build (Makefile)
        run: make build

      - name: Test (Makefile)
        run: make check

      - name: Build and install wheel
        run: make install RID=${{ matrix.rid }} TFM=net9.0 PLAT=${{ matrix.plat }}

      - name: Smoke test wheel
        run: |
          python -c "import lpjguess_runner as m; print('Imported:', m.__name__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.rid }}
          path: python/dist/*.whl
          if-no-files-found: error

  package-r:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          dependencies: '"all"'

      - name: Build and test R package
        run: |
          make stage-r TFM=net9.0
          R CMD build r
          R CMD check --no-manual lpjguessRunner_*.tar.gz

      - name: Validate R release tag
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r/v') }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#r/v}"
          version="$(Rscript -e 'cat(read.dcf("r/DESCRIPTION")[1, "Version"])')"
          test "$tag" = "$version" || {
            echo "R release tag r/v$tag does not match r/DESCRIPTION Version: $version"
            exit 1
          }

      - name: Upload R package artifact
        uses: actions/upload-artifact@v7
        with:
          name: r-package
          path: lpjguessRunner_*.tar.gz
          if-no-files-found: error

  publish-pypi:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python/v') }}
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lpjguess-runner
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
          skip-existing: true

  publish-r-github:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r/v') }}
    needs: package-r
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download R package artifact
        uses: actions/download-artifact@v8
        with:
          name: r-package
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lpjguessRunner_*.tar.gz
          generate_release_notes: true

  publish-testpypi:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/master') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
        # NOTE: TestPyPI also requires configuring a Trusted Publisher.
        # Ensure the project exists on TestPyPI and that versions are unique per upload.
