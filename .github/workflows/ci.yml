name: CI

on:
  push:
    branches: [ master, "**" ]
    tags:
      - "python/v*.*.*"
      - "r/v*.*.*"
  pull_request:
  workflow_dispatch: {}

# Required for PyPI/TestPyPI Trusted Publishing (OIDC)
permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            plat: manylinux2014_x86_64
          - os: windows-latest
            rid: win-x64
            plat: win_amd64
          - os: macos-15
            rid: osx-arm64
            plat: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip' # caching pip dependencies

      - name: Install Python build tooling
        run: python -m pip install -U wheel build

      - name: Build (Makefile)
        run: make build

      - name: Test (Makefile)
        run: make check

      - name: Build and install wheel
        run: make install RID=${{ matrix.rid }} TFM=net9.0 PLAT=${{ matrix.plat }}

      - name: Smoke test wheel
        run: |
          python -c "import lpjguess_runner as m; print('Imported:', m.__name__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.rid }}
          path: python/dist/*.whl
          if-no-files-found: error

  package-r:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          dependencies: '"all"'
          extra-packages: any::roxygen2

      - name: Build and test R package
        shell: bash
        run: |
          dotnet publish src/LpjGuess.Runner.CLI -c Release -f net9.0 -r ${{ matrix.rid }} --self-contained true -p:UseAppHost=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/r/${{ matrix.rid }}
          mkdir -p r/inst/runner
          cp publish/r/${{ matrix.rid }}/lpjg-experiment${{ matrix.rid == 'win-x64' && '.exe' || '' }} r/inst/runner/
          printf 'inst/runner/%s\n' 'lpjg-experiment${{ matrix.rid == 'win-x64' && '.exe' || '' }}' > r/BinaryFiles
          Rscript -e 'roxygen2::roxygenise("r", roclets = "rd")'
          R CMD build r
          R CMD check --no-manual lpjguessRunner_*.tar.gz

      - name: Name archive for target platform
        shell: bash
        run: |
          version="$(Rscript -e 'cat(read.dcf("r/DESCRIPTION")[1, "Version"])')"
          mv "lpjguessRunner_${version}.tar.gz" "lpjguessRunner_${version}_${{ matrix.rid }}.tar.gz"

      - name: Smoke test bundled runner without .NET on PATH
        shell: bash
        run: |
          Rscript -e 'lib <- tempfile(); dir.create(lib); install.packages(Sys.glob("lpjguessRunner_*.tar.gz"), lib = lib, repos = NULL, type = "source"); .libPaths(c(lib, .libPaths())); runner <- lpjguessRunner:::.runner_command(); executable <- if (.Platform$OS.type == "windows") "lpjg-experiment.exe" else "lpjg-experiment"; stopifnot(basename(runner$command) == executable, length(runner$prefix) == 0L); old_path <- Sys.getenv("PATH"); Sys.setenv(PATH = dirname(runner$command), DOTNET_ROOT = ""); stopifnot(Sys.which("dotnet") == ""); result <- processx::run(runner$command, "version"); Sys.setenv(PATH = old_path); stopifnot(result$status == 0L, grepl("lpjg-experiment protocol", result$stdout))'

      - name: Validate R release tag
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r/v') }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#r/v}"
          version="$(Rscript -e 'cat(read.dcf("r/DESCRIPTION")[1, "Version"])')"
          test "$tag" = "$version" || {
            echo "R release tag r/v$tag does not match r/DESCRIPTION Version: $version"
            exit 1
          }

      - name: Upload R package artifact
        uses: actions/upload-artifact@v7
        with:
          name: r-package-${{ matrix.rid }}
          path: lpjguessRunner_*.tar.gz
          if-no-files-found: error

  publish-pypi:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python/v') }}
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lpjguess-runner
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
          skip-existing: true

  publish-r-github:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r/v') }}
    needs: package-r
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download R package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: r-package-*
          path: dist
          merge-multiple: true

      - name: Write R release install notes
        shell: bash
        run: |
          # r/v0.2.0 tag -> 0.2.0 package version.
          version="${GITHUB_REF_NAME#r/v}"
          tag_url="${GITHUB_REF_NAME//\//%2F}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag_url}"
          cat > dist/r-release-notes.md <<EOF
          ## Installation

          Download the archive for your computer. The runner is self-contained;
          you do not need to install .NET or have administrator access.

          - [Linux x64](${url}/lpjguessRunner_${version}_linux-x64.tar.gz)
          - [Windows x64](${url}/lpjguessRunner_${version}_win-x64.tar.gz)
          - [macOS arm64](${url}/lpjguessRunner_${version}_osx-arm64.tar.gz)

          Install the downloaded archive in your user R library:

          \`\`\`r
          user_lib <- file.path(path.expand("~"), "R", "lpjguess-library")
          dir.create(user_lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(user_lib, .libPaths()))
          install.packages(c("jsonlite", "processx"), lib = user_lib,
                           repos = "https://cloud.r-project.org")

          install.packages(
            "/path/to/downloaded/lpjguessRunner_${version}_<platform>.tar.gz",
            lib = user_lib,
            repos = NULL,
            type = "source"
          )
          \`\`\`
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/r-release-notes.md
          files: dist/lpjguessRunner_*.tar.gz
          generate_release_notes: true

  publish-testpypi:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/master') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
        # NOTE: TestPyPI also requires configuring a Trusted Publisher.
        # Ensure the project exists on TestPyPI and that versions are unique per upload.
